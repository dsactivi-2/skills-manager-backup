# Template: Local restoration of a Docker-based app from a server dump
# Copy this to the project root, adjust ports/credentials, then:
#   docker compose -f docker-compose.local.yml up -d --build
#
# Key adaptations from production compose:
# - Removed nginx-proxy/ACME (not needed locally)
# - Mapped app ports to localhost (8081, 8082, etc.)
# - Uses named volumes for DB (not bind mounts to x86_64 InnoDB files)
# - Mounts ./databaseDump/ for auto-import on first MySQL start
# - Created empty dirs for EFS bind mounts (data only on AWS)

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --sql_mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,NO_ENGINE_SUBSTITUTION"
    container_name: MySQL
    environment:
      MYSQL_ROOT_PASSWORD: <ROOT_PASSWORD>
      MYSQL_DATABASE: <DB_NAME>
      MYSQL_USER: <DB_USER>
      MYSQL_PASSWORD: <DB_PASSWORD>
      TZ: Europe/Berlin
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./databaseDump:/docker-entrypoint-initdb.d
    networks:
      - app_network
    restart: unless-stopped

  app:
    container_name: App
    build:
      dockerfile: ./docker/app/Dockerfile
      target: release
    networks:
      - app_network
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - php-sessions:/php-sessions
      - ./efs_files:/var/www/html/files          # Empty locally, data on AWS EFS
      - ./efs_contracts:/var/www/html/contracts   # Empty locally, data on AWS EFS
    environment:
      APP_ENV: "production"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: <DB_NAME>
      DB_USER: <DB_USER>
      DB_PASSWORD: <DB_PASSWORD>

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: PhpMyAdmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: <ROOT_PASSWORD>
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - app_network

networks:
  app_network:

volumes:
  dbdata:
  php-sessions:
